let nodes, links;
let width = window.innerWidth;
let height = window.innerHeight;
let transform = {x: 0, y: 0, k: 1};
let dragging = null;
let dragOffset = {x: 0, y: 0};
let isPanning = false;
let panStart = {x: 0, y: 0};
let panTransformStart = {x: 0, y: 0};

// 初始化位置 - 按课程聚类
function initPositions() {
  const cx = {pub: width*0.3, pri: width*0.7, eco: width*0.5, cross: width*0.5};
  const cy = {pub: height*0.35, pri: height*0.35, eco: height*0.65, cross: height*0.5};
  const spread = {pub: 180, pri: 180, eco: 200, cross: 120};

  knowledgeData.nodes.forEach((n, i) => {
    const courseNodes = knowledgeData.nodes.filter(m => m.course === n.course);
    const idx = courseNodes.indexOf(n);
    const angle = (idx / courseNodes.length) * Math.PI * 2 - Math.PI/2;
    n.x = cx[n.course] + Math.cos(angle) * spread[n.course] * (0.5 + Math.random()*0.5);
    n.y = cy[n.course] + Math.sin(angle) * spread[n.course] * (0.5 + Math.random()*0.5);
    n.vx = 0; n.vy = 0;
  });
}

// 力导向模拟
function simulate(iterations) {
  const alpha = 0.3;
  const repulsion = 2000;
  const attraction = 0.008;
  const centerForce = 0.01;
  const damping = 0.85;

  for (let iter = 0; iter < iterations; iter++) {
    // 斥力
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        let dx = nodes[j].x - nodes[i].x;
        let dy = nodes[j].y - nodes[i].y;
        let dist = Math.sqrt(dx*dx + dy*dy) || 1;
        let force = repulsion / (dist * dist);
        let fx = (dx/dist) * force;
        let fy = (dy/dist) * force;
        if (nodes[i] !== dragging) { nodes[i].vx -= fx * alpha; nodes[i].vy -= fy * alpha; }
        if (nodes[j] !== dragging) { nodes[j].vx += fx * alpha; nodes[j].vy += fy * alpha; }
      }
    }
    // 引力
    links.forEach(l => {
      let s = nodes.find(n => n.id === l.s);
      let t = nodes.find(n => n.id === l.t);
      if (!s || !t) return;
      let dx = t.x - s.x;
      let dy = t.y - s.y;
      let dist = Math.sqrt(dx*dx + dy*dy) || 1;
      let idealDist = l.cross ? 150 : 100;
      let force = (dist - idealDist) * attraction;
      let fx = (dx/dist) * force;
      let fy = (dy/dist) * force;
      if (s !== dragging) { s.vx += fx * alpha; s.vy += fy * alpha; }
      if (t !== dragging) { t.vx -= fx * alpha; t.vy -= fy * alpha; }
    });
    // 向课程中心聚集
    const centers = {pub: {x: width*0.28, y: height*0.38}, pri: {x: width*0.72, y: height*0.38}, eco: {x: width*0.5, y: height*0.65}, cross: {x: width*0.5, y: height*0.48}};
    nodes.forEach(n => {
      if (n === dragging) return;
      let c = centers[n.course];
      n.vx += (c.x - n.x) * centerForce * alpha;
      n.vy += (c.y - n.y) * centerForce * alpha;
      n.vx *= damping;
      n.vy *= damping;
      n.x += n.vx;
      n.y += n.vy;
      // 边界约束
      n.x = Math.max(40, Math.min(width - 40, n.x));
      n.y = Math.max(80, Math.min(height - 40, n.y));
    });
  }
}

// 渲染
function render() {
  const svgNS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';

  // 绘制课程区域背景
  const regions = [
    {course:'pub', cx: width*0.28, cy: height*0.38, rx: 220, ry: 180, label:'国际公法', color:'#3b82f6'},
    {course:'pri', cx: width*0.72, cy: height*0.38, rx: 220, ry: 180, label:'国际私法', color:'#f59e0b'},
    {course:'eco', cx: width*0.5, cy: height*0.65, rx: 260, ry: 160, label:'国际经济法', color:'#10b981'}
  ];
  regions.forEach(r => {
    const el = document.createElementNS(svgNS, 'ellipse');
    el.setAttribute('cx', r.cx); el.setAttribute('cy', r.cy);
    el.setAttribute('rx', r.rx); el.setAttribute('ry', r.ry);
    el.setAttribute('fill', r.color);
    el.setAttribute('class', 'cluster-bg');
    el.setAttribute('opacity', activeCourses[r.course] ? '0.06' : '0.02');
    svg.appendChild(el);
    const txt = document.createElementNS(svgNS, 'text');
    txt.setAttribute('x', r.cx); txt.setAttribute('y', r.cy - r.ry + 20);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('fill', r.color);
    txt.setAttribute('font-size', '13');
    txt.setAttribute('font-weight', '600');
    txt.setAttribute('opacity', activeCourses[r.course] ? '0.5' : '0.15');
    txt.textContent = r.label;
    svg.appendChild(txt);
  });

  // 绘制连线
  links.forEach(l => {
    const s = nodes.find(n => n.id === l.s);
    const t = nodes.find(n => n.id === l.t);
    if (!s || !t) return;
    const sVis = activeCourses[s.course];
    const tVis = activeCourses[t.course];
    if (!sVis || !tVis) return;

    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', s.x); line.setAttribute('y1', s.y);
    line.setAttribute('x2', t.x); line.setAttribute('y2', t.y);
    line.setAttribute('class', 'link-line' + (l.cross ? ' cross-link' : ''));
    line.setAttribute('stroke', l.cross ? '#a78bfa' : (s.course === t.course ? (s.course==='pub'?'#3b82f6':s.course==='pri'?'#f59e0b':'#10b981') : '#a78bfa'));
    line.setAttribute('stroke-width', l.cross ? '1.5' : '1');
    line.dataset.source = l.s;
    line.dataset.target = l.t;
    svg.appendChild(line);
  });

  // 绘制节点
  nodes.forEach(n => {
    if (!activeCourses[n.course]) return;
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('transform', `translate(${n.x},${n.y})`);
    g.style.cursor = 'pointer';

    // 外圈光晕
    const glow = document.createElementNS(svgNS, 'circle');
    const colors = {pub:'#3b82f6', pri:'#f59e0b', eco:'#10b981', cross:'#a78bfa'};
    glow.setAttribute('r', n.r + 4);
    glow.setAttribute('fill', colors[n.course]);
    glow.setAttribute('opacity', '0.1');
    g.appendChild(glow);

    // 主圆
    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('r', n.r);
    circle.setAttribute('fill', colors[n.course]);
    circle.setAttribute('opacity', '0.85');
    circle.setAttribute('class', 'node-circle');
    circle.dataset.id = n.id;
    g.appendChild(circle);

    // 内圈
    const inner = document.createElementNS(svgNS, 'circle');
    inner.setAttribute('r', n.r - 3);
    inner.setAttribute('fill', 'rgba(10,22,40,0.3)');
    g.appendChild(inner);

    // 标签
    if (showLabels) {
      const label = document.createElementNS(svgNS, 'text');
      label.setAttribute('class', 'node-label');
      label.setAttribute('y', n.r + 14);
      label.setAttribute('font-size', n.r > 13 ? '11' : '10');
      label.textContent = n.id;
      g.appendChild(label);
    }

    // 事件
    g.addEventListener('mouseenter', (e) => showTooltip(e, n));
    g.addEventListener('mouseleave', hideTooltip);
    g.addEventListener('mousedown', (e) => startDrag(e, n));

    svg.appendChild(g);
  });
}

// 交互
function showTooltip(e, n) {
  const colors = {pub:'#3b82f6', pri:'#f59e0b', eco:'#10b981', cross:'#a78bfa'};
  const courseNames = {pub:'国际公法', pri:'国际私法', eco:'国际经济法', cross:'跨课程关联'};
  const relatedLinks = links.filter(l => l.s === n.id || l.t === n.id);
  const crossLinks = relatedLinks.filter(l => l.cross);

  document.getElementById('ttName').textContent = n.id;
  document.getElementById('ttName').style.color = colors[n.course];
  document.getElementById('ttCourse').textContent = courseNames[n.course];
  document.getElementById('ttDesc').textContent = n.desc;
  document.getElementById('ttLinks').textContent = crossLinks.length > 0 ? `跨课程关联: ${crossLinks.map(l => l.s === n.id ? l.t : l.s).join('、')}` : '';

  tooltip.style.left = (e.clientX + 16) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
  tooltip.classList.add('visible');

  // 高亮关联
  svg.querySelectorAll('.link-line').forEach(line => {
    if (line.dataset.source === n.id || line.dataset.target === n.id) {
      line.setAttribute('stroke-opacity', '0.6');
      line.setAttribute('stroke-width', '2.5');
    } else {
      line.setAttribute('stroke-opacity', '0.05');
    }
  });
  svg.querySelectorAll('.node-circle').forEach(c => {
    const nodeId = c.dataset.id;
    const isRelated = links.some(l => (l.s === n.id && l.t === nodeId) || (l.t === n.id && l.s === nodeId));
    if (nodeId === n.id) {
      c.setAttribute('opacity', '1');
    } else if (isRelated) {
      c.setAttribute('opacity', '0.9');
    } else {
      c.setAttribute('opacity', '0.2');
    }
  });
}

function hideTooltip() {
  tooltip.classList.remove('visible');
  svg.querySelectorAll('.link-line').forEach(line => {
    const isCross = line.classList.contains('cross-link');
    line.setAttribute('stroke-opacity', isCross ? '0.25' : '0.15');
    line.setAttribute('stroke-width', isCross ? '1.5' : '1');
  });
  svg.querySelectorAll('.node-circle').forEach(c => c.setAttribute('opacity', '0.85'));
}

function startDrag(e, n) {
  e.preventDefault();
  dragging = n;
  const rect = svg.getBoundingClientRect();
  dragOffset.x = e.clientX - rect.left - n.x;
  dragOffset.y = e.clientY - rect.top - n.y;
}

document.addEventListener('mousemove', (e) => {
  if (dragging) {
    const rect = svg.getBoundingClientRect();
    dragging.x = e.clientX - rect.left - dragOffset.x;
    dragging.y = e.clientY - rect.top - dragOffset.y;
    dragging.vx = 0; dragging.vy = 0;
    render();
  } else if (isPanning) {
    const dx = e.clientX - panStart.x;
    const dy = e.clientY - panStart.y;
    svg.style.transform = `translate(${panTransformStart.x + dx}px, ${panTransformStart.y + dy}px)`;
  }
});

document.addEventListener('mouseup', () => {
  dragging = null;
  isPanning = false;
});

svg.addEventListener('mousedown', (e) => {
  if (!dragging) {
    isPanning = true;
    panStart = {x: e.clientX, y: e.clientY};
    const t = svg.style.transform.match(/translate\(([^,]+),\s*([^)]+)\)/);
    panTransformStart = {x: t ? parseFloat(t[1]) : 0, y: t ? parseFloat(t[2]) : 0};
  }
});

svg.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.95 : 1.05;
  transform.k *= delta;
  transform.k = Math.max(0.5, Math.min(2, transform.k));
  svg.style.transform = `scale(${transform.k})`;
}, {passive: false});

// 课程筛选
function toggleCourse(course) {
  activeCourses[course] = !activeCourses[course];
  document.querySelector(`.legend-item[data-course="${course}"]`).classList.toggle('dimmed', !activeCourses[course]);
  render();
}

function showAllCourses() {
  activeCourses = {pub: true, pri: true, eco: true, cross: true};
  document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('dimmed'));
  render();
}

function toggleLabels() {
  showLabels = !showLabels;
  render();
}

function resetView() {
  svg.style.transform = '';
  transform = {x:0, y:0, k:1};
  initPositions();
  simulate(100);
  render();
}

function handleSearch(val) {
  if (!val.trim()) {
    svg.querySelectorAll('.node-circle').forEach(c => c.setAttribute('opacity', '0.85'));
    svg.querySelectorAll('.node-label').forEach(l => l.setAttribute('opacity', '1'));
    return;
  }
  const q = val.toLowerCase();
  const matched = nodes.filter(n => n.id.toLowerCase().includes(q)).map(n => n.id);
  svg.querySelectorAll('.node-circle').forEach(c => {
    const isMatch = matched.includes(c.dataset.id);
    c.setAttribute('opacity', isMatch ? '1' : '0.15');
    if (isMatch) c.setAttribute('r', parseFloat(c.getAttribute('r')) + 3);
    else c.setAttribute('r', nodes.find(n => n.id === c.dataset.id)?.r || 12);
  });
  svg.querySelectorAll('.node-label').forEach(l => {
    l.setAttribute('opacity', matched.some(m => l.textContent === m) ? '1' : '0.2');
  });
}

// 初始化
function init() {
  initPositions();
  simulate(200);
  render();

  // 更新统计
  document.getElementById('statNodes').textContent = knowledgeData.nodes.length;
  document.getElementById('statLinks').textContent = knowledgeData.links.filter(l => l.cross).length;
  document.getElementById('statPub').textContent = knowledgeData.nodes.filter(n => n.course === 'pub').length;
  document.getElementById('statPri').textContent = knowledgeData.nodes.filter(n => n.course === 'pri').length;
  document.getElementById('statEco').textContent = knowledgeData.nodes.filter(n => n.course === 'eco').length;
}

window.addEventListener('resize', () => {
  width = window.innerWidth;
  height = window.innerHeight;
  initPositions();
  simulate(50);
  render();
});

init();
</script>
</body>
