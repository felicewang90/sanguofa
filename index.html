<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三国法教学智能体</title>
  <meta name="description" content="融合国际公法、国际私法、国际经济法三大核心学科，运用AI技术赋能法学教育创新">
  <style>
/* ========================================
   三国法教学智能体 - 主样式表
   ======================================== */

/* === CSS Variables === */
:root {
  --primary: #1a2a5e;
  --primary-light: #2a3f7e;
  --primary-dark: #0f1a3e;
  --accent: #c9a84c;
  --accent-light: #e0c56a;
  --accent-dark: #a88a30;
  --bg-main: #f5f7fb;
  --bg-card: #ffffff;
  --bg-sidebar: #1e2d62;
  --text-primary: #1a1a2e;
  --text-secondary: #5a6178;
  --text-light: #8a90a5;
  --text-on-dark: #e8eaf0;
  --border: #e2e6f0;
  --border-light: #eef1f8;
  --success: #28a745;
  --warning: #f0a030;
  --danger: #dc3545;
  --info: #17a2b8;
  --shadow-sm: 0 2px 8px rgba(26, 42, 94, 0.08);
  --shadow-md: 0 4px 16px rgba(26, 42, 94, 0.12);
  --shadow-lg: 0 8px 32px rgba(26, 42, 94, 0.16);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}

/* === Reset & Base === */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 16px;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-main);
  background: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

a { text-decoration: none; color: inherit; }
ul, ol { list-style: none; }
img { max-width: 100%; display: block; }
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, textarea, select { font-family: inherit; outline: none; }

/* === Scrollbar === */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #c0c5d5; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #a0a5b5; }

/* === Layout === */
.app-container {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* === Top Navbar === */
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 64px;
  background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  z-index: 1000;
  box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2);
}

.navbar-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: 1px;
  white-space: nowrap;
}

.navbar-logo {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  object-fit: contain;
  background: transparent;
  padding: 0;
}

.navbar-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}

.nav-item {
  padding: 8px 14px;
  color: rgba(255, 255, 255, 0.75);
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 500;
  transition: var(--transition);
  white-space: nowrap;
  cursor: pointer;
  position: relative;
}

.nav-item:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
}

.nav-item.active {
  color: var(--accent-light);
  background: rgba(255, 255, 255, 0.12);
}

.nav-item.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 2px;
  background: var(--accent);
  border-radius: 1px;
}

.navbar-user {
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(255, 255, 255, 0.8);
  font-size: 0.88rem;
}

.user-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 1.5px solid rgba(255,255,255,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.user-role-label {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.75);
  white-space: nowrap;
}
/* === Main Content === */
.main-content {
  margin-top: 64px;
  flex: 1;
  min-height: calc(100vh - 64px - 60px);
}

/* === Page Views === */
.page-view {
  display: none;
  animation: fadeIn 0.35s ease;
}

.page-view.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* === Footer === */
.app-footer {
  background: var(--primary-dark);
  color: rgba(255, 255, 255, 0.6);
  padding: 16px 28px;
  text-align: center;
  font-size: 0.8rem;
  line-height: 1.8;
}

.footer-warning {
  color: var(--accent-light);
  font-weight: 500;
  margin-bottom: 4px;
}

/* === Dashboard / Home
   ======================================== */
.dashboard {
  max-width: 100%;
  padding: 0;
}

/* --- Hero Section (dark theme, redesigned) --- */
.dashboard-hero {
  position: relative;
  min-height: 380px;
  background: linear-gradient(180deg, #04091a 0%, #0b1433 30%, #142256 60%, #1a2d6b 85%, #243a72 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px 50px;
  overflow: hidden;
}

.starfield-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.dashboard-hero .hero-content {
  position: relative;
  z-index: 1;
}
.dashboard-hero .hero-deco-left,
.dashboard-hero .hero-deco-right,
.dashboard-hero .hero-corner {
  z-index: 1;
}

/* Fine grid pattern overlay */
.dashboard-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(201, 168, 76, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201, 168, 76, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* Radial golden glow center */
.dashboard-hero::after {
  content: '';
  position: absolute;
  top: 42%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 900px;
  height: 500px;
  background: radial-gradient(ellipse at center, rgba(201, 168, 76, 0.07) 0%, rgba(201, 168, 76, 0.02) 40%, transparent 70%);
  pointer-events: none;
}

/* Top golden accent bar */
.hero-top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, rgba(201,168,76,0.1) 20%, var(--accent) 50%, rgba(201,168,76,0.1) 80%, transparent 100%);
}

/* Left decorative column */
.hero-deco-left {
  position: absolute;
  left: 60px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0.12;
}
.hero-deco-line {
  width: 1px;
  height: 80px;
  background: linear-gradient(to bottom, transparent, var(--accent), transparent);
}
.hero-deco-diamond {
  width: 6px;
  height: 6px;
  background: var(--accent);
  transform: rotate(45deg);
}

/* Right decorative column (mirrored) */
.hero-deco-right {
  position: absolute;
  right: 60px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0.12;
}

/* Corner ornaments */
.hero-corner {
  position: absolute;
  width: 40px;
  height: 40px;
  opacity: 0.1;
}
.hero-corner svg { width: 100%; height: 100%; }
.hero-corner-tl { top: 30px; left: 30px; }
.hero-corner-tr { top: 30px; right: 30px; transform: scaleX(-1); }
.hero-corner-bl { bottom: 30px; left: 30px; transform: scaleY(-1); }
.hero-corner-br { bottom: 30px; right: 30px; transform: scale(-1, -1); }

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 820px;
}

/* --- Entrance Animations --- */
@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInScale {
  from {
    opacity: 0;
    transform: scaleX(0.3);
  }
  to {
    opacity: 1;
    transform: scaleX(1);
  }
}

@keyframes fadeInUpCards {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-title-wrap {
  margin-bottom: 0;
  opacity: 0;
  animation: fadeInUp 0.8s ease-out 0.2s forwards;
}

.hero-divider {
  opacity: 0;
  animation: fadeInScale 0.6s ease-out 0.6s forwards;
  transform-origin: center;
}

.hero-subtitle {
  opacity: 0;
  animation: fadeInUp 0.7s ease-out 0.9s forwards;
}

.hero-subtitle-secondary {
  opacity: 0;
  animation: fadeInUp 0.7s ease-out 1.1s forwards;
}

.module-card:nth-child(1) { opacity: 0; animation: fadeInUpCards 0.6s ease-out 1.3s forwards; }
.module-card:nth-child(2) { opacity: 0; animation: fadeInUpCards 0.6s ease-out 1.45s forwards; }
.module-card:nth-child(3) { opacity: 0; animation: fadeInUpCards 0.6s ease-out 1.6s forwards; }
.module-card:nth-child(4) { opacity: 0; animation: fadeInUpCards 0.6s ease-out 1.75s forwards; }

/* Main title */
.hero-title {
  font-size: 4.8rem;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 0;
  letter-spacing: 8px;
  line-height: 1.2;
  text-shadow: 0 4px 32px rgba(0, 0, 0, 0.4);
}

/* Golden divider */
.hero-divider {
  width: 480px;
  max-width: 80%;
  height: 3px;
  background: linear-gradient(90deg, transparent 0%, rgba(201,168,76,0.2) 10%, rgba(201,168,76,0.6) 30%, var(--accent) 50%, rgba(201,168,76,0.6) 70%, rgba(201,168,76,0.2) 90%, transparent 100%);
  margin: 20px auto 24px;
  border-radius: 2px;
  box-shadow: 0 0 16px rgba(201, 168, 76, 0.25), 0 0 48px rgba(201, 168, 76, 0.08);
}

/* Subtitle line 1 - white medium */
.hero-subtitle {
  font-size: 1.1rem;
  color: rgba(255, 255, 255, 0.85);
  max-width: 580px;
  margin: 0 auto 8px;
  line-height: 1.8;
  letter-spacing: 1px;
  font-weight: 400;
}

/* Subtitle line 2 - light grey */
.hero-subtitle-secondary {
  font-size: 0.95rem;
  color: rgba(255, 255, 255, 0.45);
  max-width: 580px;
  margin: 0 auto;
  line-height: 1.8;
  letter-spacing: 0.6px;
  font-weight: 300;
}

/* --- Module Cards --- */
.module-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  padding: 16px 28px 40px;
  max-width: 1200px;
  margin: 0 auto;
}

.module-card {
  border-radius: var(--radius-lg);
  padding: 36px 32px 28px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  cursor: pointer;
  transition: all 0.4s ease;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.04);
}

.module-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s ease;
}

.module-card:hover {
  transform: translateY(-8px) scale(1.01);
  box-shadow: 0 16px 48px rgba(201, 168, 76, 0.25), 0 4px 16px rgba(26, 42, 94, 0.12);
  border-color: var(--accent);
  background: linear-gradient(135deg, #ffffff 0%, #fffdf5 100%);
}

.module-card:hover::before {
  transform: scaleX(1);
}

/* Card 1 - Knowledge Base: Blue gradient */
.module-card:nth-child(1) {
  background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 40%, #ffffff 100%);
}
.module-card:nth-child(1)::before {
  background: linear-gradient(90deg, #1a3a8f, #4a7cff);
}
.module-card:nth-child(1):hover {
  box-shadow: 0 12px 36px rgba(26,58,143,0.15);
}

/* Card 2 - Case Simulation: Gold/Warm gradient */
.module-card:nth-child(2) {
  background: linear-gradient(135deg, #fffdf5 0%, #fff8e8 40%, #ffffff 100%);
}
.module-card:nth-child(2)::before {
  background: linear-gradient(90deg, #b8860b, #f0c040);
}
.module-card:nth-child(2):hover {
  box-shadow: 0 12px 36px rgba(184,134,11,0.15);
}

/* Card 3 - Assessment: Green gradient */
.module-card:nth-child(3) {
  background: linear-gradient(135deg, #f0faf4 0%, #e6f7ee 40%, #ffffff 100%);
}
.module-card:nth-child(3)::before {
  background: linear-gradient(90deg, #1a8a4a, #40c080);
}
.module-card:nth-child(3):hover {
  box-shadow: 0 12px 36px rgba(26,138,74,0.15);
}

/* Card 4 - Ideology: Red gradient */
.module-card:nth-child(4) {
  background: linear-gradient(135deg, #fdf2f2 0%, #fce8e8 40%, #ffffff 100%);
}
.module-card:nth-child(4)::before {
  background: linear-gradient(90deg, #b22234, #e04050);
}
.module-card:nth-child(4):hover {
  box-shadow: 0 12px 36px rgba(178,34,52,0.15);
}

.card-icon {
  width: 56px;
  height: 56px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  margin-bottom: 18px;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.card-icon.blue { background: rgba(26, 58, 143, 0.12); color: #1a3a8f; }
.card-icon.gold { background: rgba(184, 134, 11, 0.1); color: #b8860b; }
.card-icon.green { background: rgba(26, 138, 74, 0.1); color: #1a8a4a; }
.card-icon.red { background: rgba(178, 34, 52, 0.1); color: #b22234; }

.card-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: #1a1a2e;
  margin-bottom: 10px;
}

.card-desc {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 16px;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.card-tag {
  font-size: 0.72rem;
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--bg-main);
  color: var(--text-light);
  border: 1px solid var(--border);
}

.card-arrow {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 20px;
  color: var(--text-light);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.module-card:hover .card-arrow {
  transform: translateX(8px);
  color: var(--accent);
  font-size: 22px;
}

.module-card:hover .card-icon {
  transform: scale(1.08);
  filter: brightness(1.1);
}

.module-card:hover .card-arrow {
  color: var(--primary);
  transform: translateX(4px);
}

/* ========================================
   Knowledge Q&A Module
   ======================================== */
.qa-layout {
  display: flex;
  height: calc(100vh - 64px);
}

.qa-sidebar {
  width: 300px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h3 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 12px;
}

.sidebar-search {
  position: relative;
}

.sidebar-search input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  background: var(--bg-main);
  transition: var(--transition);
}

.sidebar-search input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26, 42, 94, 0.1);
}

.sidebar-search .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-light);
  font-size: 0.85rem;
}

.category-tree {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}

.tree-group {
  margin-bottom: 4px;
}

.tree-parent {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  cursor: pointer;
  transition: var(--transition);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
  gap: 8px;
}

.tree-parent:hover {
  background: rgba(26, 42, 94, 0.04);
}

.tree-parent .tree-icon {
  font-size: 1rem;
  flex-shrink: 0;
}

.tree-parent .tree-arrow {
  margin-left: auto;
  font-size: 0.7rem;
  color: var(--text-light);
  transition: transform 0.3s ease;
}

.tree-parent.expanded .tree-arrow {
  transform: rotate(90deg);
}

.tree-children {
  display: none;
  padding: 2px 0;
}

.tree-children.open {
  display: block;
}

.tree-child {
  padding: 7px 20px 7px 48px;
  font-size: 0.82rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
}

.tree-child:hover {
  background: rgba(26, 42, 94, 0.04);
  color: var(--primary);
}

.tree-child.active {
  background: rgba(26, 42, 94, 0.06);
  color: var(--primary);
  font-weight: 600;
}

.tree-child .child-count {
  margin-left: auto;
  font-size: 0.7rem;
  color: var(--text-light);
  background: var(--bg-main);
  padding: 1px 7px;
  border-radius: 8px;
}

.sidebar-actions {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  color: var(--text-secondary);
  transition: var(--transition);
  border: 1px solid var(--border);
}

.sidebar-btn:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* QA Chat Area */
.qa-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-main);
}

.qa-header {
  padding: 16px 24px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.qa-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.qa-header-left h3 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
}

.qa-header-left .qa-context {
  font-size: 0.78rem;
  color: var(--text-light);
  padding: 3px 10px;
  background: var(--bg-main);
  border-radius: 12px;
}

.qa-quick-actions {
  display: flex;
  gap: 8px;
}

.quick-action-btn {
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.78rem;
  color: var(--primary);
  background: rgba(26, 42, 94, 0.06);
  transition: var(--transition);
  white-space: nowrap;
}

.quick-action-btn:hover {
  background: var(--primary);
  color: #fff;
}

/* Chat Messages */
.qa-chat {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.chat-message {
  display: flex;
  gap: 12px;
  max-width: 85%;
}

.chat-message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.chat-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  flex-shrink: 0;
}

.chat-message.system .chat-avatar {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
}

.chat-message.user .chat-avatar {
  background: var(--accent);
  color: var(--primary-dark);
}

.chat-bubble {
  padding: 14px 18px;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  line-height: 1.75;
}

.chat-message.system .chat-bubble {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top-left-radius: 2px;
}

.chat-message.user .chat-bubble {
  background: var(--primary);
  color: #fff;
  border-top-right-radius: 2px;
}

.chat-bubble h4 {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.chat-bubble .law-article {
  background: rgba(26, 42, 94, 0.04);
  border-left: 3px solid var(--primary);
  padding: 10px 14px;
  margin: 10px 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.84rem;
  line-height: 1.8;
  color: var(--text-primary);
}

.chat-bubble .related-links {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chat-bubble .related-link {
  font-size: 0.75rem;
  padding: 4px 10px;
  background: rgba(26, 42, 94, 0.06);
  color: var(--primary);
  border-radius: 12px;
  cursor: pointer;
  transition: var(--transition);
}

.chat-bubble .related-link:hover {
  background: var(--primary);
  color: #fff;
}

.chat-bubble .china-stance {
  margin-top: 12px;
  padding: 10px 14px;
  background: rgba(201, 168, 76, 0.08);
  border-left: 3px solid var(--accent);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.84rem;
  color: var(--text-primary);
}

.chat-bubble .china-stance strong {
  color: var(--accent-dark);
}

.chat-time {
  font-size: 0.7rem;
  color: var(--text-light);
  margin-top: 6px;
}

/* Chat Input */
.qa-input-area {
  padding: 16px 24px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
}

.qa-input-wrapper {
  display: flex;
  gap: 12px;
  align-items: flex-end;
}

.qa-input-wrapper textarea {
  flex: 1;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  resize: none;
  min-height: 44px;
  max-height: 120px;
  line-height: 1.5;
  transition: var(--transition);
}

.qa-input-wrapper textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26, 42, 94, 0.1);
}

.qa-send-btn {
  padding: 10px 22px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-md);
  font-size: 0.88rem;
  font-weight: 600;
  transition: var(--transition);
  white-space: nowrap;
}

.qa-send-btn:hover {
  background: var(--primary-light);
  transform: translateY(-1px);
}

.qa-input-tips {
  margin-top: 8px;
  font-size: 0.72rem;
  color: var(--text-light);
  display: flex;
  align-items: center;
  gap: 16px;
}

.input-tip-btn {
  font-size: 0.72rem;
  color: var(--primary);
  cursor: pointer;
}

.input-tip-btn:hover {
  text-decoration: underline;
}

/* ========================================
   Case Simulation Module
   ======================================== */
.case-layout {
  display: flex;
  height: calc(100vh - 64px);
  overflow: hidden;
}

.case-list-panel {
  width: 340px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.case-list-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.case-list-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.case-list-header h3 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 4px;
}

.case-list-header p {
  font-size: 0.78rem;
  color: var(--text-light);
}

.case-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

.case-card {
  padding: 16px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  margin-bottom: 10px;
  cursor: pointer;
  transition: var(--transition);
}

.case-card:hover {
  border-color: var(--primary);
  background: rgba(26, 42, 94, 0.02);
}

.case-card.active {
  border-color: var(--primary);
  background: rgba(26, 42, 94, 0.04);
  box-shadow: var(--shadow-sm);
}

.case-card .case-tag {
  display: inline-block;
  font-size: 0.68rem;
  padding: 2px 8px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-weight: 600;
}

.case-tag.pub { background: rgba(26, 42, 94, 0.08); color: var(--primary); }
.case-tag.pri { background: rgba(201, 168, 76, 0.12); color: var(--accent-dark); }
.case-tag.eco { background: rgba(40, 167, 69, 0.1); color: var(--success); }

.case-card .case-name {
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.case-card .case-brief {
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.6;
}

.case-card .case-meta {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 0.72rem;
  color: var(--text-light);
}

/* Case Detail Area */
.case-detail {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg-main);
  overflow-y: auto;
}

.case-detail-header {
  padding: 16px 24px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.case-detail-header h3 {
  font-size: 1rem;
  font-weight: 700;
}

.role-selector {
  display: flex;
  gap: 8px;
}

.role-btn {
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  font-size: 0.8rem;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  transition: var(--transition);
}

.role-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.role-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

/* Case Content Area */
.case-content {
  flex: 1;
  display: flex;
  overflow: hidden;
}

.case-evidence {
  width: 280px;
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  flex-shrink: 0;
}

.evidence-section {
  margin-bottom: 20px;
}

.evidence-section h4 {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

.evidence-item {
  padding: 10px 12px;
  background: var(--bg-main);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  font-size: 0.8rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
}

.evidence-item:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.evidence-item .ev-icon {
  margin-right: 6px;
}

/* Case Dialogue */
.case-dialogue {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.case-dialogue-messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.dialogue-msg {
  display: flex;
  gap: 10px;
  max-width: 80%;
}

.dialogue-msg.arbiter {
  align-self: center;
  max-width: 90%;
}

.dialogue-msg.opponent {
  align-self: flex-start;
}

.dialogue-msg.self {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.dialogue-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  flex-shrink: 0;
  font-weight: 700;
}

.dialogue-msg.arbiter .dialogue-avatar {
  background: var(--accent);
  color: var(--primary-dark);
}

.dialogue-msg.opponent .dialogue-avatar {
  background: var(--danger);
  color: #fff;
}

.dialogue-msg.self .dialogue-avatar {
  background: var(--primary);
  color: #fff;
}

.dialogue-bubble {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  line-height: 1.7;
}

.dialogue-msg.arbiter .dialogue-bubble {
  background: rgba(201, 168, 76, 0.08);
  border: 1px solid rgba(201, 168, 76, 0.2);
  text-align: center;
}

.dialogue-msg.opponent .dialogue-bubble {
  background: var(--bg-card);
  border: 1px solid var(--border);
}

.dialogue-msg.self .dialogue-bubble {
  background: var(--primary);
  color: #fff;
}

.dialogue-role {
  font-size: 0.7rem;
  font-weight: 600;
  margin-bottom: 4px;
  color: var(--text-light);
}

.dialogue-msg.self .dialogue-role {
  color: rgba(255,255,255,0.7);
  text-align: right;
}

.case-dialogue-input {
  padding: 14px 20px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
}

.case-dialogue-input textarea {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  resize: none;
  min-height: 40px;
  max-height: 80px;
}

.case-dialogue-input textarea:focus {
  border-color: var(--primary);
}

.case-send-btn {
  padding: 8px 18px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 600;
}

/* Progress Bar */
.case-progress {
  padding: 12px 24px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
}

.progress-steps {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
}

.progress-steps::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 24px;
  right: 24px;
  height: 2px;
  background: var(--border);
  transform: translateY(-50%);
}

.progress-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 1;
}

.step-dot {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--text-light);
  margin-bottom: 4px;
  transition: var(--transition);
}

.progress-step.completed .step-dot {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

.progress-step.current .step-dot {
  border-color: var(--accent);
  color: var(--accent-dark);
  box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2);
}

.step-label {
  font-size: 0.68rem;
  color: var(--text-light);
  white-space: nowrap;
}

.progress-step.completed .step-label {
  color: var(--primary);
  font-weight: 600;
}

.progress-step.current .step-label {
  color: var(--accent-dark);
  font-weight: 600;
}

/* ========================================
   Assessment Module
   ======================================== */
.assess-layout {
  max-width: 1000px;
  margin: 0 auto;
  padding: 32px 28px;
}

.assess-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.assess-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg-card);
  padding: 4px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}

.assess-tab {
  padding: 8px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  color: var(--text-secondary);
  transition: var(--transition);
}

.assess-tab:hover {
  color: var(--primary);
}

.assess-tab.active {
  background: var(--primary);
  color: #fff;
  font-weight: 600;
}

.assess-actions {
  display: flex;
  gap: 10px;
}

.assess-info-bar {
  display: flex;
  gap: 20px;
  margin-bottom: 24px;
  padding: 16px 20px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
}

.assess-info-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.84rem;
  color: var(--text-secondary);
}

.assess-info-item .info-icon {
  font-size: 1rem;
}

.assess-info-item strong {
  color: var(--primary);
}

/* Question Cards */
.question-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid var(--border);
  transition: var(--transition);
}

.question-card:hover {
  box-shadow: var(--shadow-sm);
}

.question-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.question-number {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.82rem;
  font-weight: 700;
  flex-shrink: 0;
}

.question-type {
  font-size: 0.72rem;
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 600;
}

.question-type.single { background: rgba(26, 42, 94, 0.08); color: var(--primary); }
.question-type.multi { background: rgba(40, 167, 69, 0.1); color: var(--success); }
.question-type.essay { background: rgba(201, 168, 76, 0.12); color: var(--accent-dark); }

.question-points {
  margin-left: auto;
  font-size: 0.78rem;
  color: var(--text-light);
}

.question-text {
  font-size: 0.92rem;
  color: var(--text-primary);
  line-height: 1.8;
  margin-bottom: 16px;
}

.question-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  font-size: 0.86rem;
  line-height: 1.6;
}

.option-item:hover {
  border-color: var(--primary);
  background: rgba(26, 42, 94, 0.02);
}

.option-item.selected {
  border-color: var(--primary);
  background: rgba(26, 42, 94, 0.04);
}

.option-item.correct {
  border-color: var(--success);
  background: rgba(40, 167, 69, 0.05);
}

.option-item.wrong {
  border-color: var(--danger);
  background: rgba(220, 53, 69, 0.05);
}

.option-letter {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--bg-main);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-secondary);
  flex-shrink: 0;
}

.option-item.selected .option-letter {
  background: var(--primary);
  color: #fff;
}

.option-item.correct .option-letter {
  background: var(--success);
  color: #fff;
}

.option-item.wrong .option-letter {
  background: var(--danger);
  color: #fff;
}

/* Explanation */
.question-explanation {
  margin-top: 16px;
  padding: 14px 18px;
  background: rgba(26, 42, 94, 0.03);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--primary);
  display: none;
}

.question-explanation.show {
  display: block;
}

.question-explanation h5 {
  font-size: 0.82rem;
  color: var(--primary);
  margin-bottom: 6px;
}

.question-explanation p {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.7;
}

/* Submit Area */
.assess-submit-area {
  text-align: center;
  padding: 24px 0;
}

.submit-btn {
  padding: 12px 48px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-md);
  font-size: 1rem;
  font-weight: 700;
  transition: var(--transition);
}

.submit-btn:hover {
  background: var(--primary-light);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

/* Score Card */
.score-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 32px;
  text-align: center;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  display: none;
}

.score-card.show {
  display: block;
}

.score-value {
  font-size: 3rem;
  font-weight: 800;
  color: var(--primary);
  margin: 12px 0;
}

.score-label {
  font-size: 0.88rem;
  color: var(--text-secondary);
}

.score-details {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 20px;
}

.score-detail-item {
  text-align: center;
}

.score-detail-num {
  font-size: 1.4rem;
  font-weight: 700;
}

.score-detail-num.correct { color: var(--success); }
.score-detail-num.wrong { color: var(--danger); }

.score-detail-label {
  font-size: 0.78rem;
  color: var(--text-light);
}

/* Error Book */
.error-book-item {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-bottom: 12px;
  border: 1px solid var(--border);
  border-left: 3px solid var(--danger);
}

.error-book-item .error-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 0.78rem;
}

.error-book-item .error-question {
  font-size: 0.86rem;
  color: var(--text-primary);
  line-height: 1.7;
}

/* ========================================
   Ideology Module
   ======================================== */
.ideology-layout {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 28px;
}

.ideology-header {
  margin-bottom: 28px;
}

.ideology-header h2 {
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 6px;
}

.ideology-header p {
  font-size: 0.88rem;
  color: var(--text-secondary);
}

.ideology-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  margin-bottom: 32px;
}

.ideology-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 24px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: var(--transition);
}

.ideology-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.ideology-card .card-icon-sm {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-sm);
  background: rgba(201, 168, 76, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  margin-bottom: 14px;
}

.ideology-card h4 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.ideology-card p {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 12px;
}

.ideology-card .card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-light);
}

.read-more {
  color: var(--primary);
  font-weight: 600;
}


/* ========================================
   涉外法治资鉴馆 - Tab & 动态 & 教学解读样式
   ======================================== */
.zhijian-tabs {
  display: flex;
  gap: 32px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
  padding: 0 4px;
}

.zhijian-tab {
  padding: 12px 4px;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  margin-bottom: -1px;
  transition: var(--transition);
  user-select: none;
}

.zhijian-tab:hover {
  color: var(--text-primary);
}

.zhijian-tab.active {
  color: var(--primary);
  font-weight: 700;
  border-bottom-color: var(--primary);
}

.zhijian-tab-content {
  display: none;
}

.zhijian-tab-content.active {
  display: block;
  animation: fadeIn 0.3s ease;
}

/* 动态卡片列表 */
.news-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-height: 70vh;
  overflow-y: auto;
  padding-right: 8px;
}

.news-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  padding: 18px 20px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  border-left: 4px solid var(--primary);
}

.news-card:hover {
  box-shadow: var(--shadow-sm);
  transform: translateX(2px);
}

.news-card.source-npc { border-left-color: #e74c3c; }
.news-card.source-mfa { border-left-color: #3498db; }
.news-card.source-court { border-left-color: #c9a84c; }
.news-card.source-commerce { border-left-color: #27ae60; }

.news-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.news-card h4 {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.5;
  margin: 0;
  flex: 1;
}

.source-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.7rem;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}

.source-badge.source-npc {
  background: rgba(231, 76, 60, 0.12);
  color: #e74c3c;
}

.source-badge.source-mfa {
  background: rgba(52, 152, 219, 0.12);
  color: #3498db;
}

.source-badge.source-court {
  background: rgba(201, 168, 76, 0.15);
  color: #c9a84c;
}

.source-badge.source-commerce {
  background: rgba(39, 174, 96, 0.12);
  color: #27ae60;
}

.news-card-summary {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 10px;
}

.news-card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--text-light);
}

.source-link {
  font-size: 0.72rem;
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  transition: var(--transition);
  white-space: nowrap;
}

.source-link:hover {
  color: var(--primary-dark, #1a5276);
  text-decoration: underline;
}

.expand-icon {
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  gap: 3px;
}

.expand-arrow {
  transition: transform 0.3s ease;
  display: inline-block;
}

.news-card.expanded .expand-arrow {
  transform: rotate(180deg);
}

/* 教学解读展开区 */
.teaching-note {
  margin-top: 14px;
  padding: 14px 16px;
  background: rgba(201, 168, 76, 0.08);
  border-radius: var(--radius-sm);
  border-left: 3px solid #c9a84c;
  display: none;
  animation: slideDown 0.3s ease;
}

.news-card.expanded .teaching-note {
  display: block;
}

.teaching-note-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: #8b6914;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.teaching-note-body {
  font-size: 0.8rem;
  color: var(--text-secondary);
  line-height: 1.7;
}

.knowledge-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 10px;
}

.knowledge-tag {
  padding: 3px 10px;
  background: rgba(201, 168, 76, 0.15);
  color: #8b6914;
  border-radius: 12px;
  font-size: 0.72rem;
  font-weight: 500;
}

.teaching-suggestion {
  margin-top: 8px;
}

.teaching-suggestion strong {
  color: var(--text-primary);
}

.kb-link-hint {
  margin-top: 8px;
  font-size: 0.75rem;
  color: var(--text-light);
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Document Reader Modal */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 2000;
  display: none;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.3s ease;
}

.modal-overlay.show {
  display: flex;
}

.modal-content {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  width: 90%;
  max-width: 800px;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-header h3 {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--primary);
}

.modal-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: var(--text-light);
  transition: var(--transition);
}

.modal-close:hover {
  background: var(--bg-main);
  color: var(--text-primary);
}

.modal-body {
  padding: 24px;
  overflow-y: auto;
  flex: 1;
}

.modal-body .doc-content {
  font-size: 0.9rem;
  line-height: 2;
  color: var(--text-primary);
}

.modal-body .doc-content h4 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--primary);
  margin: 20px 0 10px;
}

.modal-body .doc-content p {
  margin-bottom: 12px;
}

.modal-body .doc-content .highlight-box {
  background: rgba(201, 168, 76, 0.08);
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  margin: 16px 0;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.88rem;
}

/* ========================================
   Case Placeholder (before selection)
   ======================================== */
.case-placeholder {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: var(--text-light);
}

.case-placeholder .placeholder-icon {
  font-size: 3rem;
  margin-bottom: 16px;
  opacity: 0.4;
}

.case-placeholder p {
  font-size: 0.92rem;
}

/* ========================================
   Welcome Chat
   ======================================== */
.welcome-chat {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
}

.welcome-icon {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: #fff;
  margin-bottom: 20px;
}

.welcome-chat h3 {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
}

.welcome-chat p {
  font-size: 0.88rem;
  color: var(--text-secondary);
  max-width: 420px;
  margin-bottom: 24px;
}

.welcome-suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.suggestion-chip {
  padding: 8px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 0.82rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: var(--transition);
}

.suggestion-chip:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: rgba(26, 42, 94, 0.04);
}

/* ========================================
   Responsive
   ======================================== */
@media (max-width: 1024px) {
  .module-cards {
    grid-template-columns: 1fr;
  }
  
  .ideology-grid {
    grid-template-columns: 1fr;
  }
  
  .qa-sidebar {
    width: 260px;
  }
  
  .case-list-panel {
    width: 280px;
  }
  
  .case-evidence {
    width: 240px;
  }
}


/* === 班级案例完成率网格 === */
.case-stats-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
.case-stat-item {
  text-align: center;
  padding: 12px;
  background: var(--bg-main);
  border-radius: var(--radius-sm);
}
.case-stat-name {
  font-size: 0.72rem;
  color: var(--text-secondary);
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.case-stat-pct {
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--primary);
}
@media (max-width: 768px) {
  .navbar-nav {
    display: none;
  }
  
  .qa-sidebar {
    display: none;
  }
  
  .case-layout {
    flex-direction: column;
    height: calc(100vh - 64px);
  }

  .case-list-panel {
    width: 100%;
    max-height: 45vh;
    flex-shrink: 0;
    border-right: none;
    border-bottom: 1px solid var(--border);
  }

  .case-list-scroll {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 8px 12px;
  }

  .case-card {
    min-width: unset;
    max-width: unset;
    width: 100%;
    margin-bottom: 8px;
    padding: 12px;
  }

  .case-card .case-brief {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    font-size: 0.72rem;
  }

  .case-detail {
    flex: 1;
    min-height: 0;
  }

  .case-evidence {
    width: 100%;
    max-width: none;
  }

  .mode-switch-tabs {
    display: flex;
    gap: 4px;
  }

  .mode-switch-tab {
    font-size: 0.78rem;
    padding: 6px 12px;
  }
  
  .hero-title {
    font-size: 2.8rem;
    letter-spacing: 2px;
  }
  
  .hero-subtitle {
    font-size: 0.9rem;
  }

  
  /* 教师面板移动端适配 */
  .teacher-stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
  }
  .teacher-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .teacher-table {
    min-width: 600px;
  }
  .case-stats-grid {
    grid-template-columns: repeat(2, 1fr) !important;
  }
  .case-stat-item {
    padding: 10px !important;
  }
  .teacher-sub-tabs {
    flex-wrap: wrap;
  }
  .teacher-sub-tab {
    font-size: 0.75rem;
    padding: 6px 14px;
  }
  .material-type-tabs {
    flex-wrap: wrap;
  }
  .material-type-tab {
    font-size: 0.72rem;
    padding: 5px 12px;
  }
  .mobile-back-btn {
    top: 62px;
    left: 8px;
    width: 36px;
    height: 36px;
    font-size: 1rem;
  }
  .main-content {
    padding-bottom: 60px !important;
  }
  .app-footer {
    margin-bottom: 56px !important;
  }
}

/* === 移动端浮动返回按钮 === */
.mobile-back-btn {
  display: none;
  position: fixed;
  top: 70px;
  left: 12px;
  z-index: 1000;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.95);
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid rgba(26,42,94,0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.mobile-back-btn:hover {
  background: var(--primary);
  color: #fff;
}
.mobile-back-btn.visible {
  display: flex;
}

/* === 移动端底部Tab导航栏 === */
.mobile-tab-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 999;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(0,0,0,0.06);
  box-shadow: 0 -2px 16px rgba(0,0,0,0.08);
  padding: 4px 0;
  padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px));
}
.mobile-tab-bar.visible {
  display: none !important;
}
.mobile-tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 2px 4px;
  font-size: 0.62rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: color 0.2s;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  gap: 2px;
}
.mobile-tab-item:active {
  background: rgba(26,42,94,0.05);
}
.mobile-tab-item.active {
  color: var(--primary);
}
.mobile-tab-item .tab-icon {
  font-size: 1.2rem;
  line-height: 1;
}
.mobile-tab-item .tab-label {
  font-size: 0.58rem;
  font-weight: 600;
  white-space: nowrap;
}

/* === 素材上传面板 === */
.material-upload-panel {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  margin-top: 16px;
}
.material-upload-panel h4 {
  margin: 0 0 12px;
  color: var(--primary);
  font-size: 0.95rem;
}
.material-type-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.material-type-tab {
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.material-type-tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.material-form-group {
  margin-bottom: 12px;
}
.material-form-group label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.material-form-group input,
.material-form-group select,
.material-form-group textarea {
  width: 100%;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 0.82rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
  box-sizing: border-box;
  background: #fff;
}
.material-form-group input:focus,
.material-form-group select:focus,
.material-form-group textarea:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(26,42,94,0.08);
}
.material-form-group textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.6;
}
.material-submit-btn {
  padding: 10px 28px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.material-submit-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(26,42,94,0.25);
}
.material-list-area {
  margin-top: 16px;
}
.material-item-card {
  padding: 12px 16px;
  background: var(--bg-main);
  border-radius: 10px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid var(--border);
}
.material-item-card .mat-info {
  flex: 1;
  min-width: 0;
}
.material-item-card .mat-title {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.material-item-card .mat-meta {
  font-size: 0.7rem;
  color: var(--text-light);
  margin-top: 2px;
}
.material-item-card .mat-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.mat-del-btn {
  padding: 4px 10px;
  font-size: 0.72rem;
  border: 1px solid #e74c3c;
  color: #e74c3c;
  border-radius: 6px;
  cursor: pointer;
  background: transparent;
  transition: all 0.2s;
}
.mat-del-btn:hover {
  background: #e74c3c;
  color: #fff;
}

/* === 教师面板内导航Tab === */
.teacher-sub-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.teacher-sub-tab {
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  transition: all 0.2s;
}
.teacher-sub-tab.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}


/* === Utility Classes === */
.text-center { text-align: center; }
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; justify-content: center; }
.gap-2 { gap: 8px; }
.gap-4 { gap: 16px; }

/* === Loading Animation === */
.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 8px 0;
}

.typing-indicator span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-light);
  animation: typing 1.4s infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing {
  0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}

/* === Notification Toast === */
.toast {
  position: fixed;
  top: 80px;
  right: 24px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 14px 20px;
  box-shadow: var(--shadow-lg);
  border-left: 4px solid var(--success);
  font-size: 0.85rem;
  color: var(--text-primary);
  z-index: 3000;
  transform: translateX(120%);
  transition: transform 0.4s ease;
}

.toast.show {
  transform: translateX(0);
}


/* === Teacher Panel === */
.teacher-mode-toggle {
  padding: 6px 14px;
  color: rgba(255,255,255,0.75);
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 500;
  transition: var(--transition);
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.25);
  margin-left: 8px;
  cursor: pointer;
}
.teacher-mode-toggle:hover {
  color: #fff;
  background: rgba(255,255,255,0.12);
  border-color: rgba(255,255,255,0.4);
}
.teacher-mode-toggle.active {
  color: var(--accent-light);
  background: rgba(201,168,76,0.15);
  border-color: var(--accent);
}
.teacher-panel {
  padding: 28px;
  background: var(--bg-main);
  min-height: calc(100vh - 64px - 60px);
}
.teacher-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.teacher-panel-header h2 {
  font-size: 1.4rem;
  color: var(--primary);
}
.teacher-stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.teacher-stat-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  text-align: center;
}
.teacher-stat-card .ts-num {
  font-size: 2rem;
  font-weight: 800;
  color: var(--primary);
}
.teacher-stat-card .ts-label {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-top: 4px;
}
.teacher-table-wrap {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 24px;
}
.teacher-table {
  width: 100%;
  border-collapse: collapse;
}
.teacher-table th {
  background: var(--primary);
  color: #fff;
  padding: 12px 16px;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: left;
}
.teacher-table td {
  padding: 12px 16px;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border-light);
}
.teacher-table tr:hover td {
  background: rgba(26,42,94,0.02);
}
.teacher-bar {
  height: 8px;
  border-radius: 4px;
  background: var(--border);
  overflow: hidden;
}
.teacher-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  transition: width 0.5s ease;
}
.teacher-export-btn {
  padding: 10px 24px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  transition: var(--transition);
}
.teacher-export-btn:hover {
  background: var(--primary-light);
  transform: translateY(-1px);
}

/* === Stage Components === */
.stage-reading-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  margin-bottom: 16px;
}
.stage-reading-header {
  padding: 12px 20px;
  background: linear-gradient(135deg, rgba(26,42,94,0.06), rgba(201,168,76,0.06));
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.stage-reading-body {
  padding: 20px;
}
.stage-tag {
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 12px;
  background: rgba(26,42,94,0.08);
  color: var(--primary);
  font-weight: 500;
}
.case-fact-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.case-fact-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 12px;
  background: rgba(26,42,94,0.03);
  border-radius: 8px;
  font-size: 0.85rem;
  line-height: 1.6;
}
.fact-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  flex-shrink: 0;
}

/* Trial Timeline */
.trial-timeline {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
  padding-left: 16px;
}
.trial-timeline::before {
  content: '';
  position: absolute;
  left: 22px;
  top: 12px;
  bottom: 12px;
  width: 2px;
  background: var(--border);
}
.trial-phase {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 12px 0;
  position: relative;
}
.trial-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-main);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
  flex-shrink: 0;
  z-index: 1;
}
.trial-phase.passed .trial-icon {
  background: var(--primary);
  border-color: var(--primary);
}
.trial-phase.active .trial-icon {
  background: var(--accent);
  border-color: var(--accent);
  animation: pulse 2s infinite;
}
.trial-title {
  font-size: 0.92rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.trial-desc {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.6;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.3); }
  50% { box-shadow: 0 0 0 8px rgba(201,168,76,0); }
}

/* === Material Analysis & Confusing Points CSS === */
.material-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
  border-left: 4px solid var(--primary);
}
.material-card.private-law { border-left-color: var(--accent); }
.material-card.economic-law { border-left-color: var(--success); }
.material-title {
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 12px;
}
.material-text {
  background: rgba(26,42,94,0.03);
  border-radius: 8px;
  padding: 16px;
  font-size: 0.85rem;
  line-height: 1.8;
  color: var(--text-secondary);
  margin-bottom: 16px;
  border: 1px solid var(--border-light);
}
.material-question {
  padding: 12px 0;
  border-bottom: 1px solid var(--border-light);
}
.material-question:last-child { border-bottom: none; }
.material-q-text {
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.material-q-input {
  width: 100%;
  min-height: 80px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.85rem;
  line-height: 1.6;
  resize: vertical;
  font-family: inherit;
}
.material-q-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,42,94,0.08);
}
.material-ref-answer {
  margin-top: 8px;
  padding: 12px;
  background: rgba(40,167,69,0.05);
  border-radius: 8px;
  border-left: 3px solid var(--success);
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.7;
  display: none;
}
.material-ref-answer.show { display: block; }

/* Confusing Points */
.confusing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 20px;
  padding: 20px 0;
}
.confusing-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border-light);
}
.confusing-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.confusing-card-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.confusing-card-subject {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(26,42,94,0.08);
  color: var(--primary);
}
.confusing-card-preview {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.6;
}
.confusing-detail {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
}
.confusing-compare-table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
}
.confusing-compare-table th,
.confusing-compare-table td {
  padding: 12px 16px;
  text-align: left;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border-light);
}
.confusing-compare-table th {
  background: var(--primary);
  color: #fff;
  font-weight: 600;
}
.confusing-compare-table td:first-child {
  font-weight: 600;
  color: var(--primary);
  width: 120px;
}
.confusing-diff-list {
  list-style: none;
  padding: 0;
  margin: 12px 0;
}
.confusing-diff-list li {
  padding: 8px 0;
  font-size: 0.85rem;
  color: var(--text-secondary);
  border-bottom: 1px dashed var(--border-light);
  line-height: 1.6;
}
.confusing-diff-list li:last-child { border-bottom: none; }
.confusing-mnemonic {
  margin-top: 12px;
  padding: 10px 16px;
  background: rgba(201,168,76,0.08);
  border-radius: 8px;
  font-size: 0.82rem;
  color: var(--accent-dark);
  border-left: 3px solid var(--accent);
}

/* Document Templates */
.doc-template-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  padding: 16px 0;
}
.doc-template-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
  border: 2px solid transparent;
}
.doc-template-card:hover {
  border-color: var(--primary);
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.doc-template-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
}
.doc-template-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
}
.doc-template-name-en {
  font-size: 0.75rem;
  color: var(--text-light);
  margin-bottom: 8px;
}
.doc-template-desc {
  font-size: 0.82rem;
  color: var(--text-secondary);
  line-height: 1.6;
}

/* === Interactive Case Simulation === */
.sim-step-indicator {
  display: flex;
  justify-content: center;
  gap: 0;
  margin: 24px 0;
  padding: 0 20px;
}
.sim-step-item {
  flex: 1;
  text-align: center;
  position: relative;
  max-width: 180px;
}
.sim-step-item::before {
  content: '';
  position: absolute;
  top: 18px;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--border);
  z-index: 0;
}
.sim-step-item:first-child::before { left: 50%; }
.sim-step-item:last-child::before { right: 50%; }
.sim-step-circle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text-light);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.85rem;
  position: relative;
  z-index: 1;
  transition: var(--transition);
}
.sim-step-item.active .sim-step-circle {
  background: var(--primary);
  color: #fff;
  box-shadow: 0 0 0 4px rgba(26,42,94,0.15);
}
.sim-step-item.done .sim-step-circle {
  background: var(--success);
  color: #fff;
}
.sim-step-item.done::before,
.sim-step-item.active::before {
  background: var(--success);
}
.sim-step-label {
  display: block;
  font-size: 0.72rem;
  color: var(--text-secondary);
  margin-top: 6px;
  font-weight: 500;
}
.sim-step-item.active .sim-step-label {
  color: var(--primary);
  font-weight: 700;
}

/* Role selection cards */
.role-select-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  margin: 20px 0;
}
.role-select-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
}
.role-select-card:hover {
  border-color: var(--primary-light);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.role-select-card.selected {
  border-color: var(--primary);
  background: rgba(26,42,94,0.04);
  box-shadow: 0 0 0 3px rgba(26,42,94,0.1);
}
.role-select-card .role-icon {
  font-size: 2.2rem;
  margin-bottom: 8px;
}
.role-select-card .role-name {
  font-weight: 700;
  color: var(--primary);
  font-size: 0.95rem;
}
.role-select-card .role-desc {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 4px;
  line-height: 1.5;
}

/* Issue analysis area */
.issue-list {
  list-style: none;
  padding: 0;
}
.issue-list li {
  padding: 12px 16px;
  background: var(--bg-main);
  border-left: 3px solid var(--primary);
  margin-bottom: 8px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-size: 0.88rem;
  line-height: 1.6;
}
.issue-list li strong {
  color: var(--primary);
}

/* Opinion textarea */
.opinion-textarea {
  width: 100%;
  min-height: 200px;
  padding: 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  line-height: 1.8;
  resize: vertical;
  transition: border-color 0.3s;
  font-family: var(--font-main);
}
.opinion-textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(26,42,94,0.08);
}
.char-counter {
  text-align: right;
  font-size: 0.78rem;
  color: var(--text-light);
  margin-top: 6px;
}
.char-counter.warning { color: var(--danger); }
.char-counter.ok { color: var(--success); }

/* Score report */
.score-report {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 28px;
  box-shadow: var(--shadow-md);
  margin: 20px 0;
}
.score-total {
  text-align: center;
  padding: 20px 0;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 20px;
}
.score-total .score-num {
  font-size: 3.5rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.score-total .score-label {
  font-size: 0.9rem;
  color: var(--text-secondary);
}
.score-breakdown {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 20px;
}
.score-item {
  text-align: center;
  padding: 16px;
  background: var(--bg-main);
  border-radius: var(--radius-md);
}
.score-item .si-num {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary);
}
.score-item .si-label {
  font-size: 0.78rem;
  color: var(--text-secondary);
  margin-top: 2px;
}
.score-item .si-bar {
  height: 6px;
  border-radius: 3px;
  background: var(--border);
  margin-top: 8px;
  overflow: hidden;
}
.score-item .si-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.8s ease;
}
.score-feedback {
  padding: 16px;
  background: rgba(40,167,69,0.06);
  border-radius: var(--radius-md);
  border-left: 3px solid var(--success);
  font-size: 0.88rem;
  line-height: 1.8;
}
.score-feedback h5 {
  color: var(--success);
  margin-bottom: 8px;
}

/* Collapsible materials */
.collapsible-section {
  margin-bottom: 10px;
}
.collapsible-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: var(--bg-main);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  font-weight: 600;
  font-size: 0.88rem;
}
.collapsible-header:hover {
  background: rgba(26,42,94,0.04);
  border-color: var(--primary-light);
}
.collapsible-header .arrow {
  transition: transform 0.3s;
  font-size: 0.7rem;
  margin-left: auto;
  color: var(--text-light);
}
.collapsible-header.open .arrow {
  transform: rotate(90deg);
}
.collapsible-body {
  display: none;
  padding: 14px 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  font-size: 0.85rem;
  line-height: 1.8;
  max-height: 300px;
  overflow-y: auto;
}
.collapsible-body.open {
  display: block;
}
.collapsible-body .law-text {
  white-space: pre-wrap;
  color: var(--text-primary);
}
.collapsible-body .role-duty {
  padding: 10px 14px;
  background: var(--bg-main);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
}
.collapsible-body .role-duty h5 {
  color: var(--primary);
  margin-bottom: 4px;
}

/* Dynamic case input */
.dynamic-case-input {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}
.dynamic-case-input input {
  flex: 1;
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 0.9rem;
  transition: border-color 0.3s;
}
.dynamic-case-input input:focus {
  border-color: var(--primary);
}
.dynamic-case-input button {
  padding: 10px 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.85rem;
  white-space: nowrap;
  flex-shrink: 0;
  transition: var(--transition);
}
.dynamic-case-input button:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

/* Case tag */
.case-gen-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: rgba(201,168,76,0.1);
  border: 1px solid var(--accent);
  border-radius: 20px;
  font-size: 0.78rem;
  color: var(--accent-dark);
  font-weight: 600;
  margin-bottom: 12px;
}

/* Mode switch tabs */
.mode-switch-tabs {
  display: flex;
  gap: 0;
  margin: 16px 0;
  background: var(--bg-main);
  border-radius: var(--radius-md);
  padding: 4px;
  border: 1px solid var(--border);
}
.mode-switch-tab {
  flex: 1;
  padding: 10px 16px;
  text-align: center;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
}
.mode-switch-tab:hover {
  color: var(--primary);
  background: rgba(26,42,94,0.04);
}
.mode-switch-tab.active {
  background: var(--bg-card);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
}

/* Next step button */
.sim-next-btn {
  padding: 12px 32px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: #fff;
  border-radius: var(--radius-md);
  font-weight: 700;
  font-size: 0.9rem;
  margin-top: 16px;
  transition: var(--transition);
}
.sim-next-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}
.sim-next-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* KB search in simulation */
.kb-search-box {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.kb-search-box input {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
}
.kb-search-box button {
  padding: 10px 18px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-weight: 600;
}
.kb-result-inline {
  padding: 10px 14px;
  background: var(--bg-main);
  border-radius: var(--radius-sm);
  margin-top: 8px;
  font-size: 0.82rem;
  line-height: 1.7;
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--border);
}

@media (max-width: 768px) {
  .teacher-stats-grid { grid-template-columns: repeat(2, 1fr); }
  .score-breakdown { grid-template-columns: 1fr; }
  .role-select-grid { grid-template-columns: repeat(2, 1fr); }
  .sim-step-label { font-size: 0.65rem; }
}

/* === 智能摘要头 & 追问引导 & 关键词高亮 === */
.kb-summary-card {
  margin-bottom: 14px;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(201,168,76,0.10) 0%, rgba(201,168,76,0.04) 100%);
  border: 1px solid rgba(201,168,76,0.22);
  border-radius: 10px;
  font-size: 0.84rem;
  line-height: 1.7;
  color: var(--text-primary);
}
.kb-summary-card .summary-icon {
  margin-right: 6px;
}
.kb-summary-card strong {
  color: var(--accent-dark);
}
.kb-followup-area {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}
.kb-followup-area .followup-label {
  font-size: 0.75rem;
  color: var(--text-light);
  margin-bottom: 8px;
}
.kb-followup-area .followup-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.kb-followup-btn {
  display: inline-block;
  padding: 5px 14px;
  font-size: 0.78rem;
  color: var(--primary);
  background: rgba(26,42,94,0.06);
  border: 1px solid rgba(26,42,94,0.12);
  border-radius: 16px;
  cursor: pointer;
  transition: var(--transition);
  line-height: 1.4;
}
.kb-followup-btn:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.kb-filter-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  font-size: 0.72rem;
  color: var(--accent-dark);
  background: rgba(201,168,76,0.12);
  border-radius: 12px;
  margin-bottom: 8px;
}
mark.kb-highlight {
  background: #fff3b0;
  color: inherit;
  padding: 0 2px;
  border-radius: 2px;
}
.kb-mode-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  font-size: 0.68rem;
  color: #fff;
  background: var(--info);
  border-radius: 10px;
  margin-left: 8px;
  vertical-align: middle;
}


/* === Login Overlay === */
#loginOverlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  background: rgba(0, 0, 0, 0.5);
  display: none;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease;
}
#loginOverlay.visible {
  display: flex;
}
.login-modal-close {
  position: absolute;
  top: 12px;
  right: 16px;
  font-size: 1.4rem;
  color: #999;
  cursor: pointer;
  background: none;
  border: none;
  line-height: 1;
  padding: 4px 8px;
  border-radius: 4px;
  transition: all 0.2s;
}
.login-modal-close:hover {
  color: #333;
  background: #f0f0f0;
}
.navbar-login-btn {
  padding: 6px 18px;
  border: 1.5px solid rgba(255,255,255,0.5);
  border-radius: 8px;
  color: #fff;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  background: rgba(255,255,255,0.1);
}
.navbar-login-btn:hover {
  background: rgba(255,255,255,0.2);
  border-color: rgba(255,255,255,0.8);
}
.login-card {
  background: #fff;
  border-radius: 16px;
  padding: 40px 36px;
  max-width: 400px;
  width: 90%;

/* === UX Enhancement: Simulation Stage Transition === */
@keyframes stageEnter {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.sim-stage-content {
  animation: stageEnter 0.4s ease-out;
}

/* Stage completion checkmark flash */
@keyframes completeFlash {
  0% { border-color: var(--success); box-shadow: 0 0 0 rgba(40,167,69,0); }
  50% { border-color: var(--success); box-shadow: 0 0 8px rgba(40,167,69,0.4); }
  100% { border-color: transparent; box-shadow: 0 0 0 rgba(40,167,69,0); }
}
.sim-step-item.done {
  animation: completeFlash 0.6s ease-out;
}

/* === UX Enhancement: Quiz Timer & Progress === */
.quiz-timer-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: linear-gradient(135deg, rgba(26,42,94,0.04), rgba(26,42,94,0.01));
  border: 1px solid rgba(26,42,94,0.08);
  border-radius: 12px;
  margin-bottom: 16px;
  gap: 16px;
}

  font-size: 1.4rem;
  font-weight: 700;

  color: var(--primary);
  min-width: 70px;
  text-align: center;
  letter-spacing: 1px;
}
.quiz-timer-display.warning {
  color: var(--danger);
  animation: timerBlink 1s ease-in-out infinite;
}
@keyframes timerBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.quiz-progress-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;

  border-radius: 4px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 4px;
  transition: width 0.4s ease;
  min-width: 0;
}

/* === UX Enhancement: Export Toast Feedback === */

  to { opacity: 1; transform: translateX(0); }

  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(40px); }

}

  animation: toastFadeOut 0.4s ease-in forwards;
}
